<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marina Ibiza Apps</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marina Ibz">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1F3A68; --text:#14181F; --dim:#6B7480; --line:#E1E5EA; --soft:#F4F6F8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--text); font-family:Manrope,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--navy); text-decoration:none; }
  .wrap { max-width:960px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 40px); }
  header { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:28px 0 8px; }
  header img { width:min(220px,60vw); height:auto; display:block; }
  .kicker { font-size:12px; font-weight:600; letter-spacing:.18em; color:var(--dim); }
  .dept { margin-top:30px; }
  .dept-h { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .dept-name { font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .rule { flex:1; height:1px; background:var(--line); }
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px 10px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:24px 16px; } }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text); background:none; border:0; padding:4px 0; font:inherit; cursor:pointer; border-radius:16px; }
  .app:active { opacity:.6; }
  @media (hover:hover) { .app:hover .ico { transform:translateY(-2px); box-shadow:0 8px 18px rgba(31,58,104,.25); } }
  .ico { width:64px; height:64px; border-radius:18px; color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; letter-spacing:.02em; box-shadow:0 4px 12px rgba(31,58,104,.18); transition:transform .15s, box-shadow .15s; }
  .lbl { font-size:11.5px; font-weight:600; line-height:1.25; text-align:center; text-wrap:pretty; max-width:96px; }
  .add .ico { background:#fff; color:var(--navy); border:1.5px dashed #A9B9D0; box-shadow:none; font-size:28px; font-weight:500; }
  .add .lbl { color:var(--dim); }
  .edit-badge { position:absolute; top:-2px; right:calc(50% - 40px); width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .empty { font-size:13px; color:var(--dim); padding:4px 0; }
  .btn { height:44px; padding:0 16px; border-radius:12px; border:0; font:700 14px Manrope,system-ui,sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn.light { background:rgba(255,255,255,.14); color:#fff; }
  .btn.white { background:#fff; color:var(--navy); }
  .btn.navy { background:var(--navy); color:#fff; }
  .btn.ghost { background:var(--soft); color:var(--text); }
  .btn.danger { background:#FBECEC; color:#A3282B; }
  .scrim { position:fixed; inset:0; background:rgba(20,24,31,.4); display:flex; align-items:flex-end; justify-content:center; z-index:10; animation:fade .15s; }
  @media (min-width:640px) { .scrim { align-items:center; } }
  .sheet { width:100%; max-width:440px; background:#fff; border-radius:24px 24px 0 0; padding:12px 22px calc(env(safe-area-inset-bottom) + 24px); display:flex; flex-direction:column; gap:16px; animation:up .2s ease-out; max-height:90vh; overflow:auto; }
  @media (min-width:640px) { .sheet { border-radius:24px; padding:24px; } .grab { display:none; } }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); align-self:center; }
  .sheet h2 { margin:0; font-size:20px; font-weight:700; }
  .sheet p { margin:0; font-size:13px; line-height:1.5; color:var(--dim); }
  label { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:700; color:var(--dim); letter-spacing:.04em; }
  input, select, textarea { height:48px; border:1px solid var(--line); border-radius:12px; padding:0 14px; font:500 16px Manrope,system-ui,sans-serif; color:var(--text); background:#fff; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--navy); box-shadow:0 0 0 3px #E1E9F4; }
  textarea { height:180px; padding:12px; font:500 12px ui-monospace,Menlo,monospace; resize:none; }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
  .pin { display:flex; gap:10px; justify-content:center; }
  .pin div { width:16px; height:16px; border-radius:50%; border:2px solid var(--navy); }
  .pin div.f { background:var(--navy); }
  .pin.err { animation:shake .3s; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { height:56px; border:0; border-radius:14px; background:var(--soft); font:600 22px Manrope,system-ui,sans-serif; color:var(--text); cursor:pointer; }
  .pad button:active { background:#E3E8EF; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatches button { width:36px; height:36px; border-radius:10px; border:2px solid transparent; cursor:pointer; }
  .swatches button.on { border-color:var(--text); box-shadow:inset 0 0 0 2px #fff; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--text); color:#fff; padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; z-index:20; animation:up .2s; }
  .install { margin:28px auto 0; display:flex; align-items:center; gap:12px; max-width:420px; padding:12px 14px; border:1px solid var(--line); border-radius:16px; }
  .install img { width:40px; height:40px; border-radius:10px; border:1px solid var(--line); }
  .install div { flex:1; font-size:13px; font-weight:600; }
  .install small { display:block; font-weight:500; color:var(--dim); }
  @keyframes up { from { transform:translateY(20px); opacity:0; } }
  @keyframes fade { from { opacity:0; } }
  @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  [hidden] { display:none !important; }
  .splash { position:fixed; inset:0; z-index:50; background:#fff; display:flex; align-items:center; justify-content:center; animation:splash 1.5s ease-in-out forwards; }
  .splash img { width:min(260px,64vw); height:auto; animation:breathe 1.5s ease-in-out; }
  @keyframes splash { 0% { opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { opacity:0; } }
  @keyframes breathe { 0% { transform:scale(.94); } 50% { transform:scale(1); } 100% { transform:scale(1.02); } }
  .viewer { position:fixed; inset:0; z-index:40; background:#fff; display:flex; flex-direction:column; }
  .vbar { flex:none; display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 6px) 12px 6px 6px; border-bottom:1px solid var(--line); background:#fff; }
  .back { height:44px; padding:0 14px 0 8px; border:0; border-radius:12px; background:none; color:var(--navy); font:700 15px Manrope,system-ui,sans-serif; display:flex; align-items:center; gap:4px; cursor:pointer; }
  .back:hover { background:var(--soft); }
  .vtitle { flex:1; min-width:0; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); }
  .vtitle i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; vertical-align:1px; }
  .viewer iframe { flex:1; width:100%; border:0; display:block; background:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.webp" alt="Marina Ibiza">
    <span class="kicker">APPS DEL PUERTO</span>
  </header>
  <main id="list"></main>
  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="">
    <div id="installText">Instalar en el móvil<small>Acceso directo a pantalla completa</small></div>
    <button class="btn navy" id="installBtn">Instalar</button>
  </div>
</div>
<div id="modal"></div>
<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="back" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Inicio</button>
    <span class="vtitle" id="vtitle"></span>
  </div>
  <iframe id="frame" title="App" allow="clipboard-write; geolocation; camera; microphone"></iframe>
</div>

<script>
// ===== LISTA DE APPS — pega aquí lo que genera «Exportar lista» =====
const DEPTS = [
  { name: "Recepción", color: "#1F3A68" },
  { name: "Marineros", color: "#3E6FA8" }
];
const APPS = [
  { name: "Revisión contadores", dept: "Recepción", url: "https://iaelicozzolino-boop.github.io/revision-de-contadores/#recepcion" },
  { name: "Listado contadores",  dept: "Marineros", url: "https://iaelicozzolino-boop.github.io/listado-contadores/v4/" },
  { name: "Alarmas guías",       dept: "Marineros", url: "https://iaelicozzolino-boop.github.io/alarma-guias/alarma-guias-firebase.html" }
];
// ===== FIN LISTA =====

const data = { depts: DEPTS, apps: APPS };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mono = n => { const w = n.trim().split(/\s+/).filter(Boolean); return ((w[0]||"")[0] + ((w[1]||w[0]||"")[w[1] ? 0 : 1] || "")).toUpperCase(); };
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); };

function render() {
  $("#list").innerHTML = data.depts.map(d => {
    const apps = data.apps.map((a, i) => ({ ...a, i })).filter(a => a.dept === d.name);
    if (!apps.length) return "";
    const tiles = apps.map(a => `<button class="app" data-open="${a.i}"><div class="ico" style="background:${d.color}">${esc(mono(a.name))}</div><span class="lbl">${esc(a.name)}</span></button>`).join("");
    return `<section class="dept"><div class="dept-h"><span class="dot" style="background:${d.color}"></span><span class="dept-name">${esc(d.name)}</span><span class="rule"></span></div><div class="grid">${tiles}</div></section>`;
  }).join("");
}

$("#list").addEventListener("click", e => {
  const t = e.target.closest("[data-open]"); if (!t) return;
  openApp(+t.dataset.open);
});
render();

// ===== Abrir apps dentro del hub =====
let actx;
function waves(dur = 1.5) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime, sr = actx.sampleRate;
    const buf = actx.createBuffer(1, sr * dur, sr), ch = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < ch.length; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; ch[i] = b * 3.5; }
    const src = actx.createBufferSource(); src.buffer = buf;
    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(250, t0);
    lp.frequency.linearRampToValueAtTime(1600, t0 + dur * 0.45);
    lp.frequency.exponentialRampToValueAtTime(300, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.9, t0 + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(lp).connect(g).connect(actx.destination);
    src.start(t0); src.stop(t0 + dur);
  } catch (e) {}
}
const sea = new Audio("sounds/resaca.wav"); sea.preload = "auto";
function playSea() {
  try { sea.currentTime = 0; const p = sea.play(); if (p) p.catch(() => waves(1.5)); } catch (e) { waves(1.5); }
}
function splash() {
  const s = document.createElement("div"); s.className = "splash";
  s.innerHTML = '<img src="logo.webp" alt="Marina Ibiza">';
  document.body.appendChild(s); playSea();
  return new Promise(r => setTimeout(() => { s.remove(); r(); }, 1500));
}
async function openApp(i, fromHistory) {
  const a = data.apps[i]; if (!a) return;
  const d = data.depts.find(x => x.name === a.dept) || { color: "#1F3A68" };
  const frame = $("#frame");
  frame.src = a.url;
  if (!fromHistory) history.pushState({ app: i }, "", "#app=" + i);
  await splash();
  $("#vtitle").innerHTML = '<i style="background:' + d.color + '"></i>' + esc(a.name);
  $("#viewer").hidden = false;
  document.body.style.overflow = "hidden";
}
function closeApp() {
  $("#viewer").hidden = true;
  $("#frame").src = "about:blank";
  document.body.style.overflow = "";
}
$("#back").onclick = () => history.state && history.state.app != null ? history.back() : closeApp();
window.addEventListener("popstate", e => { if (e.state && e.state.app != null) openApp(e.state.app, true); else closeApp(); });
history.replaceState(null, "", location.pathname + location.search);

let deferred;
const isStandalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS && !isStandalone) {
  // iOS no lanza beforeinstallprompt: la instalación es manual desde Safari.
  $("#install").hidden = false;
  $("#installBtn").hidden = true;
  $("#installText").innerHTML = 'Instalar en iPhone<small>En Safari, pulsa Compartir y luego «Añadir a pantalla de inicio»</small>';
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!isStandalone) $("#install").hidden = false; });
$("#installBtn").onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("#install").hidden = true; };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
